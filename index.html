<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABF Emplacamentos — Vitória da Conquista, BA</title>
<meta name="description" content="Emplacamentos veiculares, transferências e serviços administrativos em Vitória da Conquista, BA. Atendimento rápido para pessoa física e jurídica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Barlow',Arial,sans-serif;background:#F5F6F8;color:#191A24;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#F5F6F8}::-webkit-scrollbar-thumb{background:#C8CCDA;border-radius:3px}

/* ─── 3D Plate ─── */
.plate-scene{
  perspective:1100px;
  perspective-origin:50% 45%;
  display:flex;align-items:center;justify-content:center;
  padding:30px 20px 50px;
}
.plate-3d{
  width:400px;height:132px;
  position:relative;
  transform-style:preserve-3d;
  animation:plateSpin 8s linear infinite;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,0.55));
}
@keyframes plateSpin{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}
.plate-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:5px;
}
.plate-front{transform:translateZ(5px)}
.plate-back{transform:rotateY(180deg) translateZ(5px)}
.plate-edge-top{
  position:absolute;width:400px;height:10px;
  top:0;left:0;transform-origin:top center;
  transform:rotateX(90deg) translateZ(-5px);
  backface-visibility:hidden;
  background:linear-gradient(to bottom,#b0b0b0,#888);
}
.plate-edge-bottom{
  position:absolute;width:400px;height:10px;
  bottom:0;left:0;transform-origin:bottom center;
  transform:rotateX(-90deg) translateZ(-5px);
  backface-visibility:hidden;
  background:linear-gradient(to top,#b0b0b0,#888);
}
.plate-edge-left{
  position:absolute;width:10px;height:132px;
  top:0;left:0;transform-origin:left center;
  transform:rotateY(-90deg) translateZ(-5px);
  backface-visibility:hidden;
  background:linear-gradient(to right,#b0b0b0,#888);
}
.plate-edge-right{
  position:absolute;width:10px;height:132px;
  top:0;right:0;transform-origin:right center;
  transform:rotateY(90deg) translateZ(-5px);
  backface-visibility:hidden;
  background:linear-gradient(to left,#b0b0b0,#888);
}
.plate-reflection{
  width:400px;height:40px;
  background:linear-gradient(to bottom,rgba(255,255,255,0.08),transparent);
  border-radius:50%;
  margin-top:4px;
  filter:blur(6px);
  transform:scaleY(0.4);
  opacity:0.6;
  animation:reflectSpin 8s linear infinite;
}
@keyframes reflectSpin{
  from{transform:scaleY(0.4) scaleX(1)}
  25%{transform:scaleY(0.4) scaleX(0.05)}
  50%{transform:scaleY(0.4) scaleX(1)}
  75%{transform:scaleY(0.4) scaleX(0.05)}
  to{transform:scaleY(0.4) scaleX(1)}
}

/* ─── Section Backgrounds ─── */
.bg-hero{
  background-color:#0D2260;
  background-image:
    radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),
    radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:32px 32px,16px 16px;
  background-position:0 0,8px 8px;
}
.bg-dark{
  background-color:#091748;
  background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:20px 20px;
}
.bg-light{
  background-color:#F5F6F8;
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 24px,rgba(26,58,143,0.025) 24px,rgba(26,58,143,0.025) 25px);
}
.bg-red{
  background-color:#CC1E2E;
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 12px,rgba(0,0,0,0.06) 12px,rgba(0,0,0,0.06) 13px);
}
.bg-white{background:#fff}
.bg-blue{background:#1A3A8F}

/* ─── Mobile Menu Overlay ─── */
.mobile-nav{
  display:none;
  position:fixed;
  top:88px;left:0;right:0;
  background:#0A1E5C;
  z-index:98;
  flex-direction:column;
  border-top:2px solid rgba(204,30,46,0.5);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  max-height:calc(100vh - 88px);
  overflow-y:auto;
}
.mobile-nav.open{display:flex}
.mobile-nav-link{
  font-family:'Barlow Condensed',Arial,sans-serif;
  font-size:18px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:rgba(255,255,255,0.85);
  padding:16px 24px;
  border:none;background:none;cursor:pointer;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.07);
  min-height:56px;
  transition:background 150ms,color 150ms;
}
.mobile-nav-link:active,.mobile-nav-link:hover{background:rgba(255,255,255,0.07);color:#fff}
.mobile-nav-cta{
  font-family:'Barlow Condensed',Arial,sans-serif;
  font-size:16px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  background:#CC1E2E;color:#fff;
  margin:16px;border-radius:4px;
  border:none;cursor:pointer;
  padding:14px 20px;min-height:52px;
  transition:background 150ms;
}
.mobile-nav-cta:active{background:#9E1520}

/* ─── Hamburger Button ─── */
.hamburger-btn{
  display:none;
  background:none;border:none;cursor:pointer;
  padding:8px;color:#fff;
  flex-direction:column;gap:5px;
  min-height:44px;min-width:44px;
  align-items:center;justify-content:center;
  border-radius:4px;
}
.hamburger-btn:hover{background:rgba(255,255,255,0.08)}
.ham-line{
  width:22px;height:2px;
  background:#fff;border-radius:1px;
  transition:transform 200ms,opacity 200ms;
  display:block;
}
.ham-open .ham-line:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ham-open .ham-line:nth-child(2){opacity:0;transform:scaleX(0)}
.ham-open .ham-line:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ─── Responsive ─── */
@media(max-width:900px){
  .hero-inner{flex-direction:column!important;text-align:center}
  .hero-stats{justify-content:center!important}
  .hero-btns{justify-content:center!important}
  .services-grid{grid-template-columns:1fr 1fr!important}
  .trust-grid{grid-template-columns:1fr!important}
  .footer-grid{grid-template-columns:1fr 1fr!important}
  .contact-grid{grid-template-columns:1fr!important}
  .showcase-inner{flex-direction:column!important;text-align:center;align-items:center!important}
  .differentials-inner{flex-wrap:wrap!important}
  .cta-inner{flex-direction:column!important;text-align:center;align-items:center!important}
  .plate-3d{width:300px!important;height:99px!important}
  .plate-edge-top{width:300px!important}
  .plate-edge-bottom{width:300px!important}
  .plate-reflection{width:300px!important}
}

@media(max-width:768px){
  /* Topbar: esconder horário, reduzir padding */
  .topbar-hours{display:none!important}
  .topbar{padding:0 16px!important;height:auto!important;min-height:32px}

  /* Nav: hamburger visível, links escondidos */
  .nav-links{display:none!important}
  .hamburger-btn{display:flex!important}
  .nav-main{padding:0 16px!important;height:56px!important}

  /* Hero: esconder placa no mobile, ajustar espaçamento */
  .hero-plate-wrapper{display:none!important}
  .hero-section{padding:40px 20px 44px!important;min-height:auto!important}
  .hero-h1{font-size:40px!important;line-height:1.0!important}
  .hero-lead{font-size:15px!important}
  .hero-btns{flex-direction:column!important;gap:10px!important;align-items:stretch!important}
  .hero-btns button{width:100%!important;text-align:center!important;justify-content:center!important;padding:14px!important}
  .hero-stats{gap:16px!important}

  /* Sections: padding menor */
  .section-services,.section-trust,.section-contact,.section-showcase{padding:40px 20px!important}
  .section-cta{padding:32px 20px!important}
  .differentials-strip{padding:12px 16px!important}

  /* Diferenciais: grid 2×2 */
  .differentials-inner{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px!important}
  .diff-divider{display:none!important}

  /* Form: campos 2-col → 1-col */
  .form-2col{grid-template-columns:1fr!important}

  /* CTA banner button full-width */
  .cta-btn-wrap{width:100%!important}
  .cta-btn-wrap button{width:100%!important}

  /* Touch targets mínimos */
  button{min-height:44px}
  input,select,textarea{
    min-height:48px!important;
    font-size:16px!important;
  }

  /* Placa no showcase menor */
  .plate-3d{width:280px!important;height:92px!important}
  .plate-edge-top{width:280px!important}
  .plate-edge-bottom{width:280px!important}
  .plate-reflection{width:280px!important}

  /* Footer */
  .footer-grid{grid-template-columns:1fr 1fr!important}
}

@media(max-width:480px){
  .hero-h1{font-size:34px!important}
  .services-grid{grid-template-columns:1fr!important}
  .footer-grid{grid-template-columns:1fr!important}
  .differentials-inner{grid-template-columns:1fr!important}
  .trust-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ══════════════════════════════════
   MERCOSUL PLATE COMPONENT
═══════════════════════════════════ */

                <div><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>Nome Completo *</label><input style={inp} type="text" placeholder="João Silva" value={form.name} onChange={e=>upd('name',e.target.value)} required/></div>
                <div><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>CPF / CNPJ *</label><input style={inp} type="text" placeholder="000.000.000-00" value={form.cpf} onChange={e=>upd('cpf',e.target.value)} required/></div>
              </div>
              <div className="form-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
                <div><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>Telefone *</label><input style={inp} type="text" placeholder="(77) 99999-0000" value={form.phone} onChange={e=>upd('phone',e.target.value)} required/></div>
                <div><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>Placa</label><input style={inp} type="text" placeholder="ABC-1D23" value={form.plate} onChange={e=>upd('plate',e.target.value)}/></div>
              </div>
              <div style={{marginBottom:12}}><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>Tipo de Serviço *</label>
                <select style={{...inp}} value={form.service} onChange={e=>upd('service',e.target.value)} required>
                  <option value="">Selecione o serviço</option>
                  <option>Emplacamento Novo</option>
                  <option>Transferência de Placa</option>
                  <option>Fotocópia de Documentos</option>
                  <option>Serviços Administrativos</option>
                </select>
              </div>
              <div style={{marginBottom:16}}><label style={{display:'block',fontFamily:'Barlow,Arial,sans-serif',fontSize:13,fontWeight:500,color:'#3D4257',marginBottom:4}}>Observações</label>
                <textarea style={{...inp,resize:'vertical'}} rows={3} placeholder="Informações adicionais..." value={form.notes} onChange={e=>upd('notes',e.target.value)}/>
              </div>
              <button type="submit" style={{width:'100%',padding:'13px',background:'#CC1E2E',color:'#fff',border:'none',borderRadius:4,fontFamily:'Barlow Condensed,Arial,sans-serif',fontSize:15,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',cursor:'pointer'}}>Enviar Solicitação</button>
            </form>
          )}
        </div>
      </div>
    </section>
  );
};

/* ══════════════════════════════════
   FOOTER
═══════════════════════════════════ */

    <div style={{maxWidth:1216,margin:'0 auto'}}>
      <div className="footer-grid" style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:40,marginBottom:40,paddingBottom:32,borderBottom:'1px solid rgba(255,255,255,0.1)'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',marginBottom:16}}>
            <div style={{width:4,height:44,background:'#CC1E2E',borderRadius:1,marginRight:12,flexShrink:0}}></div>
            <div>
              <div style={{fontFamily:'Barlow Condensed,Arial Narrow,Arial,sans-serif',fontSize:34,fontWeight:900,color:'#fff',letterSpacing:-0.5,lineHeight:1}}>ABF</div>
              <div style={{fontFamily:'Barlow Condensed,Arial,sans-serif',fontSize:10,fontWeight:600,color:'rgba(255,255,255,0.45)',letterSpacing:2.5,textTransform:'uppercase',marginTop:3}}>Emplacamentos</div>
            </div>
          </div>
          <p style={{fontFamily:'Barlow,Arial,sans-serif',fontSize:14,color:'rgba(255,255,255,0.5)',lineHeight:1.6,maxWidth:280}}>Serviços veiculares com agilidade e confiança em Vitória da Conquista, BA.</p>
        </div>
        {[['Serviços',['Emplacamento Novo','Transferência','Fotocópias','Serv. Adm.']],['Empresa',['Sobre Nós','Início','Contato']],['Contato',['Rua das Placas, 123','Vitória da Conquista, BA','(77) 9999-0000','Seg–Sex 8h–18h']]].map(([title,items])=>(
          <div key={title}>
            <div style={{fontFamily:'Barlow Condensed,Arial,sans-serif',fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.35)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:14}}>{title}</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {items.map(item=><span key={item} style={{fontFamily:'Barlow,Arial,sans-serif',fontSize:14,color:'rgba(255,255,255,0.6)',cursor:'pointer'}}>{item}</span>)}
            </div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
        <div style={{fontFamily:'Barlow,Arial,sans-serif',fontSize:12,color:'rgba(255,255,255,0.3)'}}>© {new Date().getFullYear()} ABF Emplacamentos. Todos os direitos reservados.</div>
        <div style={{fontFamily:'Barlow Condensed,Arial,sans-serif',fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.25)',letterSpacing:'0.06em',textTransform:'uppercase'}}>Vitória da Conquista · BA</div>
      </div>
    </div>
  </footer>
);

/* ══════════════════════════════════
   PAGE BANNER
═══════════════════════════════════ */
const PageBanner = ({eyebrow,title}) => (
  <div className="bg-hero" style={{padding:'40px 32px 36px',position:'relative'}}>
    <div style={{position:'absolute',left:0,top:0,bottom:0,width:5,background:'#CC1E2E'}}></div>
    <div style={{maxWidth:1216,margin:'0 auto'}}>
      <div style={{fontFamily:'Barlow Condensed,Arial,sans-serif',fontSize:11,fontWeight:600,letterSpacing:'0.15em',textTransform:'uppercase',color:'#CC1E2E',marginBottom:8}}>{eyebrow}</div>
      <h1 style={{fontFamily:'Barlow Condensed,Arial Narrow,Arial,sans-serif',fontSize:52,fontWeight:900,color:'#fff',textTransform:'uppercase'}}>{title}</h1>
    </div>
  </div>
);

/* ══════════════════════════════════
   APP
═══════════════════════════════════ */
const App = () => {
  const [page,setPage] = useState('home');
  const gotoContact = () => {
    setPage('home');
    setTimeout(()=>{
      const el = document.getElementById('contact');
      if(el){ const y=el.getBoundingClientRect().top+window.scrollY-80; window.scrollTo({top:y,behavior:'smooth'}); }
    },80);
  };
  return (
    <div>
      <Header page={page} onNav={setPage}/>
      {page==='home'&&<>
        <Hero onCTA={gotoContact}/>
        <Differentials/>
        <Services onCTA={gotoContact}/>
        <PlateShowcase onCTA={gotoContact}/>
        <Trust/>
        <CTABanner onCTA={gotoContact}/>
        <Contact/>
      </>}
      {page==='services'&&<>
        <PageBanner eyebrow="O que fazemos" title="Nossos Serviços"/>
        <Services onCTA={gotoContact}/>
        <PlateShowcase onCTA={gotoContact}/>
        <CTABanner onCTA={gotoContact}/>
        <Contact/>
      </>}
      {page==='contact'&&<>
        <PageBanner eyebrow="Estamos aqui" title="Fale Conosco"/>
        <Contact/>
      </>}
      {page==='about'&&<>
        <PageBanner eyebrow="Nossa história" title="Sobre a ABF"/>
        <Trust/>
        <CTABanner onCTA={()=>setPage('contact')}/>
      </>}
      <Footer onNav={setPage}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
